<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Trái tim pháo hoa 3D</title>
  <style>
    body { margin: 0; overflow: hidden; background: black; }
    canvas { display: block; }
  </style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/controls/OrbitControls.js"></script>
<script>
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.z = 100;

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Hạt trái tim
const particles = 3000;
const geometry = new THREE.BufferGeometry();
const positions = [];
const colors = [];

function heartFunction(t) {
  const x = 16 * Math.pow(Math.sin(t), 3);
  const y = 13 * Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t);
  return {x, y};
}

for (let i = 0; i < particles; i++) {
  const t = Math.random() * Math.PI * 2;
  const h = heartFunction(t);
  const x = h.x * 2 + (Math.random() - 0.5) * 2;
  const y = h.y * 2 + (Math.random() - 0.5) * 2;
  const z = (Math.random() - 0.5) * 10;
  positions.push(x, y, z);

  colors.push(1.0, 0.9, 0.2); // vàng
}

geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

const material = new THREE.PointsMaterial({ size: 0.8, vertexColors: true });
const points = new THREE.Points(geometry, material);
scene.add(points);

// Chữ xoay vòng
const fontLoader = new THREE.FontLoader();
fontLoader.load('https://threejs.org/examples/fonts/helvetiker_regular.typeface.json', function(font) {
  const textGeo = new THREE.TextGeometry('Chúc Vân mùa Trung Thu ấm áp', {
    font: font,
    size: 3,
    height: 0.5,
    curveSegments: 12,
  });
  const textMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const textMesh = new THREE.Mesh(textGeo, textMat);
  textMesh.position.set(-40, -30, 0);
  scene.add(textMesh);

  function animateText() {
    textMesh.rotation.y += 0.01;
    requestAnimationFrame(animateText);
  }
  animateText();
});

function animate() {
  requestAnimationFrame(animate);
  points.rotation.y += 0.002;
  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
